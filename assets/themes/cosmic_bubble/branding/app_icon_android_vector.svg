<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="androidBgGrad" cx="45%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#4CC9F0" />
      <stop offset="35%" stop-color="#7209B7" />
      <stop offset="75%" stop-color="#F72585" />
      <stop offset="100%" stop-color="#240046" />
    </radialGradient>

    <!-- Mascot Star Gradient -->
    <radialGradient id="starBodyGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFF9A6" />
      <stop offset="45%" stop-color="#FFD166" />
      <stop offset="85%" stop-color="#FF9E00" />
      <stop offset="100%" stop-color="#F77F00" />
    </radialGradient>

    <!-- Bubble Helmet Gloss -->
    <radialGradient id="helmetGrad" cx="35%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#4CC9F0" stop-opacity="0.35" />
      <stop offset="80%" stop-color="#FAF0FF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#9D4EDD" stop-opacity="0.5" />
    </radialGradient>

    <!-- Planetary Ring Gradient -->
    <linearGradient id="orbitRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CC9F0" />
      <stop offset="50%" stop-color="#FFD166" />
      <stop offset="100%" stop-color="#F72585" />
    </linearGradient>

    <!-- Soft Drop Shadow for Clay Layers -->
    <filter id="androidShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#12002B" flood-opacity="0.45" />
    </filter>
    <filter id="bubbleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="iconDiscShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#0a001a" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Circular Android Adaptive Mask Base -->
  <circle cx="256" cy="256" r="236" fill="url(#androidBgGrad)" filter="url(#iconDiscShadow)" />
  <!-- White Subtle Rim / Highlight -->
  <circle cx="256" cy="256" r="234" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.35" />

  <!-- Background Ambient Nebula Bubbles -->
  <g opacity="0.6">
    <circle cx="120" cy="130" r="32" fill="#4CC9F0" opacity="0.45" filter="url(#bubbleGlow)" />
    <circle cx="112" cy="122" r="9" fill="#FFFFFF" opacity="0.75" />
    <circle cx="400" cy="140" r="38" fill="#9D4EDD" opacity="0.5" filter="url(#bubbleGlow)" />
    <circle cx="390" cy="130" r="10" fill="#FFFFFF" opacity="0.8" />
    <circle cx="380" cy="380" r="24" fill="#4CC9F0" opacity="0.4" />
    <circle cx="130" cy="380" r="28" fill="#FFD166" opacity="0.35" />
  </g>

  <!-- Back Orbit Ring (Behind Character) -->
  <path d="M 86 280 C 86 200 170 160 256 160 C 342 160 426 200 426 280" fill="none" stroke="url(#orbitRingGrad)" stroke-width="22" stroke-linecap="round" opacity="0.7" />

  <!-- Star Character Body Group -->
  <g filter="url(#androidShadow)">
    <!-- 3D Star Shape -->
    <polygon points="256,120 286,200 372,204 304,258 328,342 256,294 184,342 208,258 140,204 226,200" fill="url(#starBodyGrad)" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round" />

    <!-- Rosy Cheeks -->
    <ellipse cx="218" cy="265" rx="14" ry="8" fill="#F72585" opacity="0.7" filter="url(#bubbleGlow)" />
    <ellipse cx="294" cy="265" rx="14" ry="8" fill="#F72585" opacity="0.7" filter="url(#bubbleGlow)" />

    <!-- Cute Eyes: Winking Expression -->
    <!-- Left Eye: Big Joyful Eye with Catchlights -->
    <ellipse cx="224" cy="242" rx="11" ry="14" fill="#240046" />
    <circle cx="221" cy="237" r="4.5" fill="#FFFFFF" />
    <circle cx="227" cy="248" r="2.2" fill="#FFFFFF" />

    <!-- Right Eye: Cheerful Wink Arch -->
    <path d="M 282 244 Q 295 233 308 244" fill="none" stroke="#240046" stroke-width="6" stroke-linecap="round" />

    <!-- Smile with open happy mouth -->
    <path d="M 244 266 Q 256 284 268 266" fill="#D62828" stroke="#240046" stroke-width="5" stroke-linecap="round" />
    <path d="M 248 267 Q 256 276 264 267" fill="#FF70A6" />
  </g>

  <!-- Front Orbit Ring (Over Character) -->
  <path d="M 76 280 C 76 355 160 395 256 395 C 352 395 436 355 436 280" fill="none" stroke="url(#orbitRingGrad)" stroke-width="22" stroke-linecap="round" />
  <path d="M 96 285 C 96 345 170 380 256 380 C 342 380 416 345 416 285" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.85" />

  <!-- Iridescent Soap Bubble Space Helmet Overlay -->
  <circle cx="256" cy="248" r="148" fill="url(#helmetGrad)" stroke="#FFFFFF" stroke-width="6" stroke-opacity="0.9" filter="url(#androidShadow)" />
  <!-- Helmet Glass Specular Highlights -->
  <ellipse cx="205" cy="155" rx="42" ry="20" fill="#FFFFFF" opacity="0.75" transform="rotate(-25, 205, 155)" />
  <circle cx="340" cy="330" r="14" fill="#FFFFFF" opacity="0.5" />

  <!-- Sparkling Cross Accents (Google Play Pop) -->
  <!-- Top Left Cyan Sparkle -->
  <path d="M 120 90 Q 120 110 100 110 Q 120 110 120 130 Q 120 110 140 110 Q 120 110 120 90 Z" fill="#4CC9F0" stroke="#FFFFFF" stroke-width="2" filter="url(#bubbleGlow)" />
  <!-- Right Golden Star Accent -->
  <path d="M 405 240 Q 405 255 390 255 Q 405 255 405 270 Q 405 255 420 255 Q 405 255 405 240 Z" fill="#FFD166" stroke="#FFFFFF" stroke-width="2" />
  <!-- Mini White Sparkle -->
  <circle cx="160" cy="330" r="5" fill="#FFFFFF" opacity="0.9" />

  <!-- Floating Micro Soda Fizz Bubbles -->
  <circle cx="195" cy="410" r="11" fill="#4CC9F0" opacity="0.75" />
  <circle cx="192" cy="407" r="3" fill="#FFFFFF" />
  <circle cx="320" cy="420" r="13" fill="#F72585" opacity="0.7" />
  <circle cx="317" cy="417" r="3.5" fill="#FFFFFF" />
</svg>