<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CC9F0" />
      <stop offset="35%" stop-color="#7209B7" />
      <stop offset="70%" stop-color="#F72585" />
      <stop offset="100%" stop-color="#3A0CA3" />
    </linearGradient>

    <!-- Planet Gradient -->
    <radialGradient id="planetGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFD166" />
      <stop offset="60%" stop-color="#FF70A6" />
      <stop offset="100%" stop-color="#F72585" />
    </radialGradient>

    <!-- Star Glow Gradient -->
    <radialGradient id="starGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFF9A6" />
      <stop offset="60%" stop-color="#FFD166" />
      <stop offset="100%" stop-color="#FF9E00" />
    </radialGradient>

    <!-- Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CC9F0" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#FAF0FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#9D4EDD" stop-opacity="0.9" />
    </linearGradient>

    <!-- Gloss Highlight -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Clay Drop Shadows -->
    <filter id="clayShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#1A0033" flood-opacity="0.35" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Squircle Background with 3D Border -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" filter="url(#clayShadow)" />
  <rect x="20" y="20" width="472" height="472" rx="104" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6" />

  <!-- Top Glass Highlight Rim on Icon -->
  <path d="M 124 24 Q 256 36 388 24 C 440 24 476 60 484 112 C 430 180 340 210 256 210 C 172 210 82 180 28 112 C 36 60 72 24 124 24 Z" fill="url(#glossGrad)" opacity="0.4" />

  <!-- Background Bubble Orbs -->
  <circle cx="100" cy="140" r="28" fill="#4CC9F0" opacity="0.4" filter="url(#softGlow)" />
  <circle cx="92" cy="132" r="8" fill="#FFFFFF" opacity="0.7" />

  <circle cx="410" cy="160" r="36" fill="#9D4EDD" opacity="0.5" filter="url(#softGlow)" />
  <circle cx="400" cy="150" r="10" fill="#FFFFFF" opacity="0.8" />

  <circle cx="120" cy="380" r="20" fill="#FFD166" opacity="0.4" />
  <circle cx="390" cy="370" r="26" fill="#4CC9F0" opacity="0.4" />

  <!-- Back Ring Segment (behind planet) -->
  <path d="M 80 270 C 80 220 160 190 256 190 C 352 190 432 220 432 270" fill="none" stroke="url(#ringGrad)" stroke-width="26" stroke-linecap="round" opacity="0.65" />

  <!-- Central Cosmic Planet Body -->
  <g filter="url(#clayShadow)">
    <circle cx="256" cy="256" r="130" fill="url(#planetGrad)" stroke="#FFFFFF" stroke-width="8" stroke-opacity="0.9" />

    <!-- Cute Planet Cheerful Face -->
    <!-- Eyes -->
    <ellipse cx="215" cy="245" rx="12" ry="15" fill="#2B0038" />
    <circle cx="211" cy="240" r="5" fill="#FFFFFF" />
    <circle cx="218" cy="252" r="2.5" fill="#FFFFFF" />

    <ellipse cx="297" cy="245" rx="12" ry="15" fill="#2B0038" />
    <circle cx="293" cy="240" r="5" fill="#FFFFFF" />
    <circle cx="300" cy="252" r="2.5" fill="#FFFFFF" />

    <!-- Rosy Cheeks -->
    <ellipse cx="190" cy="265" rx="16" ry="9" fill="#FF1493" opacity="0.65" filter="url(#softGlow)" />
    <ellipse cx="322" cy="265" rx="16" ry="9" fill="#FF1493" opacity="0.65" filter="url(#softGlow)" />

    <!-- Smiling Mouth -->
    <path d="M 238 268 Q 256 288 274 268" fill="none" stroke="#2B0038" stroke-width="6" stroke-linecap="round" />

    <!-- Glossy Highlight on Planet Head -->
    <path d="M 180 180 Q 230 150 300 165 C 290 195 240 195 180 180 Z" fill="#FFFFFF" opacity="0.55" />
  </g>

  <!-- Front Ring Segment (over planet) -->
  <path d="M 70 270 C 70 340 155 375 256 375 C 357 375 442 340 442 270" fill="none" stroke="url(#ringGrad)" stroke-width="26" stroke-linecap="round" />
  <path d="M 90 275 C 90 330 165 365 256 365 C 347 365 422 330 422 275" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.8" />

  <!-- Little Golden Star Buddy Orbiting (Top-Right) -->
  <g transform="translate(350, 150) rotate(15)" filter="url(#clayShadow)">
    <polygon points="0,-34 10,-10 34,-10 14,6 22,30 0,16 -22,30 -14,6 -34,-10 -10,-10" fill="url(#starGrad)" stroke="#FFFFFF" stroke-width="4" />
    <!-- Mini star eyes -->
    <circle cx="-6" cy="2" r="2.5" fill="#3D1A00" />
    <circle cx="6" cy="2" r="2.5" fill="#3D1A00" />
    <path d="M -3 7 Q 0 11 3 7" fill="none" stroke="#3D1A00" stroke-width="2" stroke-linecap="round" />
    <!-- Star cheek sparkles -->
    <circle cx="-10" cy="5" r="2" fill="#FF70A6" opacity="0.7" />
    <circle cx="10" cy="5" r="2" fill="#FF70A6" opacity="0.7" />
  </g>

  <!-- Sparkle Crosses -->
  <!-- Big Cyan Sparkle (Top-Left) -->
  <path d="M 110 90 Q 110 115 85 115 Q 110 115 110 140 Q 110 115 135 115 Q 110 115 110 90 Z" fill="#4CC9F0" stroke="#FFFFFF" stroke-width="2" filter="url(#softGlow)" />
  <circle cx="110" cy="115" r="3" fill="#FFFFFF" />

  <!-- Gold Sparkle (Bottom-Left) -->
  <path d="M 85 320 Q 85 335 70 335 Q 85 335 85 350 Q 85 335 100 335 Q 85 335 85 320 Z" fill="#FFD166" stroke="#FFFFFF" stroke-width="2" />

  <!-- White Mini Sparkles -->
  <path d="M 410 290 Q 410 300 400 300 Q 410 300 410 310 Q 410 300 420 300 Q 410 300 410 290 Z" fill="#FFFFFF" opacity="0.9" />

  <!-- Tiny Soda Bubbles with highlights -->
  <circle cx="210" cy="380" r="10" fill="#4CC9F0" opacity="0.7" />
  <circle cx="207" cy="377" r="3" fill="#FFFFFF" />

  <circle cx="310" cy="390" r="14" fill="#F72585" opacity="0.6" />
  <circle cx="306" cy="386" r="4" fill="#FFFFFF" />
</svg>